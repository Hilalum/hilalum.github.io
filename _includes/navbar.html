<header class="site-nav">
  <div class="site-nav__inner">
    <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="Hilalum 的博客首页">
      <span class="site-brand__name">Hilalum</span>
      <span class="site-brand__note">的博客</span>
    </a>
    <button class="site-nav__toggle" type="button" aria-expanded="false" aria-controls="siteNavLinks">菜单</button>
    <nav class="site-nav__links" id="siteNavLinks" aria-label="主要导航">
      <a class="site-nav__link{% if page.url == '/' %} is-active{% endif %}" href="{{ '/' | relative_url }}"><span>主页</span><small>Home</small></a>
      <a class="site-nav__link{% if page.section == 'notes' or page.categories contains 'culture' %} is-active{% endif %}" href="{{ '/posts' | relative_url }}"><span>思考</span><small>Notes</small></a>
      <a class="site-nav__link{% if page.category == 'travel' or page.categories contains 'travel' %} is-active{% endif %}" href="{{ '/category/travel' | relative_url }}"><span>旅行</span><small>Travel</small></a>
      <a class="site-nav__link{% if page.category == 'tech' or page.categories contains 'tech' %} is-active{% endif %}" href="{{ '/category/tech' | relative_url }}"><span>技术</span><small>Tech</small></a>
      <a class="site-nav__link{% if page.url contains '/about' %} is-active{% endif %}" href="{{ '/about' | relative_url }}"><span>关于我</span><small>About</small></a>
    </nav>
  </div>
</header>
